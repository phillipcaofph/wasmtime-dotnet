name: Component fiber compatibility probes
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/fiber-stress.yml'
  workflow_dispatch:
    inputs:
      iterations:
        description: Calls per worker (20 for smoke tests; increase for a soak run)
        default: '20'
      gc_stress:
        description: DOTNET_GCStress for child probes only (empty to disable; 0xC for stress)
        default: ''
      timeout_seconds:
        description: Timeout per child process
        default: '600'

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        # Windows only runs the isolated probes: managed callbacks on Windows fibers are unsupported.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
        configuration: [Debug, Release]
        framework: [net9.0, net10.0]
        # The direct path is a known-crashing diagnostic on Linux, so only manual runs include it.
        isolation: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["off", "on"]' || '["on"]') }}
        exclude:
          - configuration: Debug
            isolation: "on"
          - os: windows-2025
            isolation: "off"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      # Build the library first: its multi-target build downloads Wasmtime, which the test
      # project's single-target reference build does not.
      - name: Build
        run: dotnet build src/Wasmtime.csproj -c ${{ matrix.configuration }}
      - name: Run crash-isolated probes
        env:
          WASMTIME_FIBER_ITERATIONS: ${{ inputs.iterations || '20' }}
          WASMTIME_FIBER_GC_STRESS: ${{ inputs.gc_stress || '' }}
          WASMTIME_FIBER_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds || '120' }}
          WASMTIME_FIBER_DUMP_DIRECTORY: ${{ runner.temp }}/wasmtime-fiber-dumps
          WASMTIME_CALLBACK_BRIDGE_EXPERIMENT: ${{ matrix.isolation == 'on' && '1' || '' }}
          WASMTIME_FIBER_PROBES: '1'
        run: >
          dotnet test tests/Wasmtime.Tests.csproj
          -c ${{ matrix.configuration }} -p:TestTargetFramework=${{ matrix.framework }}
          -p:BuildCallbackBridge=${{ matrix.isolation == 'on' }}
          --filter "FullyQualifiedName~ComponentFiberStressTests|FullyQualifiedName~HostCallbackIsolationTests|FullyQualifiedName~ComponentAsyncHostFunctionTests|FullyQualifiedName~ComponentAsyncYieldTests"
          --logger trx --results-directory TestResults
      - name: Collect reports and crash dumps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fiber-${{ matrix.os }}-${{ matrix.configuration }}-${{ matrix.framework }}-isolation-${{ matrix.isolation }}
          path: |
            TestResults
            ${{ runner.temp }}/wasmtime-fiber-dumps
          if-no-files-found: warn
